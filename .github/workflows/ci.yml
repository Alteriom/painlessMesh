name: CI/CD Pipeline

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch: {}

# Prevent duplicate runs for the same workflow
# For PRs, use PR number to ensure uniqueness
# For pushes, use the full ref
# This ensures only one workflow runs per PR or push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-desktop:
    name: Desktop Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, asan]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
          # AddressSanitizer build: catches use-after-free / double-free in
          # the task and connection lifecycle (regression coverage for issue
          # #373, where a Task deleted itself inside its own onDisable).
          - compiler: asan
            cc: gcc-13
            cxx: g++-13
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libboost-system-dev ${{ matrix.cc }} ${{ matrix.cxx }}

      - name: Configure build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # Use different warning flags for clang vs gcc to handle stricter clang warnings
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            cmake -G Ninja . -DCMAKE_CXX_FLAGS="-Wall -Werror -Wno-vla-cxx-extension"
          elif [[ "${{ matrix.compiler }}" == "asan" ]]; then
            cmake -G Ninja . \
              -DCMAKE_CXX_FLAGS="-Wall -Werror -fsanitize=address -fno-omit-frame-pointer -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          else
            cmake -G Ninja . -DCMAKE_CXX_FLAGS="-Wall -Werror"
          fi

      - name: Build
        run: ninja

      - name: Run tests
        env:
          # Leak detection is intentionally off for the asan build: the test
          # fakes intentionally leak a few objects (e.g. fake_asynctcp peer
          # clients). The signal we want here is use-after-free/double-free.
          ASAN_OPTIONS: detect_leaks=0
        run: run-parts --regex catch_ bin/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ matrix.compiler }}
          path: |
            bin/
            *.log

  build-arduino:
    name: Arduino Build Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, esp8266]
        include:
          - board: esp32
            fqbn: esp32:esp32:esp32
          - board: esp8266
            # nodemcuv2 (not generic): examples use NodeMCU pin aliases
            # (D8 etc.) and the example platformio.ini targets nodemcuv2
            fqbn: esp8266:esp8266:nodemcuv2
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino cores
        run: |
          arduino-cli config init --config-dir test/ci/
          
          # Add ESP8266 board manager URL first
          arduino-cli config add board_manager.additional_urls http://arduino.esp8266.com/stable/package_esp8266com_index.json --config-dir test/ci/
          
          # Update index with retry logic for transient server errors
          for i in 1 2 3; do
            if arduino-cli core update-index --config-dir test/ci/; then
              break
            else
              echo "Attempt $i failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          # Install both ESP32 and ESP8266 platforms
          arduino-cli core install esp32:esp32 --config-dir test/ci/
          arduino-cli core install esp8266:esp8266 --config-dir test/ci/

      - name: Install library dependencies
        run: |
          # "Async TCP" is the maintained ESP32Async v3.x library that
          # library.json declares (esp32async/AsyncTCP ^3.4.7) and that
          # ESP Async WebServer v3 requires — NOT the legacy v1 "AsyncTCP"
          arduino-cli lib install ArduinoJson TaskScheduler "Async TCP" ESPAsyncTCP PubSubClient "ESP Async WebServer" --config-dir test/ci/

      - name: Install library from source
        run: |
          # Resolve the sketchbook/user dir from the SAME config the compile
          # step uses, so the source copy is guaranteed to be visible
          USER_DIR=$(arduino-cli config get directories.user --config-dir test/ci/)
          echo "Arduino user dir: $USER_DIR"
          mkdir -p "$USER_DIR/libraries/painlessMesh"
          cp -r src examples library.properties "$USER_DIR/libraries/painlessMesh/"

      - name: Compile examples
        run: |
          # NOTE: an earlier version tested [ -f "${example}*.ino" ] — a
          # quoted glob that never matches, so no example was ever compiled.
          # Compile every proper sketch dir (dir name == ino name), including
          # nested ones (e.g. examples/priority/priority_basic_example/).
          failed=0
          while read -r ino; do
            dir=$(dirname "$ino")
            base=$(basename "$dir")
            if [ "$(basename "$ino")" = "$base.ino" ]; then
              echo "::group::Building example: $dir"
              if ! arduino-cli compile --config-dir test/ci/ --fqbn ${{ matrix.fqbn }} "$dir"; then
                echo "::error::Example failed to compile: $dir"
                failed=1
              fi
              echo "::endgroup::"
            fi
          done < <(find examples -name '*.ino' | sort)
          exit $failed

  build-platformio:
    name: PlatformIO Build Test  
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run PlatformIO tests
        run: |
          # Test critical examples to ensure reliability
          bash test/ci/test_platformio.sh --example basic
          bash test/ci/test_platformio.sh --example alteriom

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          # Install clang-format if not available
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format
          
          # Check formatting only for files in examples/alteriom (our new files)
          # Existing core library files may have different formatting conventions
          if find examples/alteriom -name "*.cpp" -o -name "*.hpp" -o -name "*.h" 2>/dev/null | grep -q .; then
            find examples/alteriom -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
              xargs clang-format --dry-run --Werror
            echo "✅ Alteriom files are properly formatted"
          else
            echo "ℹ️ No Alteriom-specific files to check formatting"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          # Only check for TODO/FIXME in newly added Alteriom files
          # The existing core library files have legitimate TODOs for future improvements
          if find examples/alteriom -name "*.cpp" -o -name "*.hpp" -o -name "*.h" 2>/dev/null | grep -q .; then
            if grep -r "TODO\|FIXME" examples/alteriom/ --include="*.cpp" --include="*.hpp" --include="*.h"; then
              echo "Found TODO/FIXME comments in Alteriom files. Please address or document them."
              exit 1
            else
              echo "✅ No TODO/FIXME comments found in Alteriom files"
            fi
          else
            echo "ℹ️ No Alteriom files to check for TODO/FIXME comments"
          fi

  arduino-library-validation:
    name: Arduino Library Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Fetch tags
        run: git fetch --tags

      - name: Run Arduino Library Compliance Check
        run: |
          chmod +x scripts/validate-arduino-compliance.sh
          bash scripts/validate-arduino-compliance.sh

      - name: Run PlatformIO Library Structure Validation
        run: |
          python3 scripts/validate_library_structure.py

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-test-desktop, build-arduino, build-platformio, code-quality, arduino-library-validation]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Desktop Build & Test: ${{ needs.build-test-desktop.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Arduino Build Test: ${{ needs.build-arduino.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- PlatformIO Build Test: ${{ needs.build-platformio.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Arduino Library Validation: ${{ needs.arduino-library-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if any job failed or was cancelled
          if [[ "${{ needs.build-test-desktop.result }}" != "success" ]] || \
             [[ "${{ needs.build-arduino.result }}" != "success" ]] || \
             [[ "${{ needs.build-platformio.result }}" != "success" ]] || \
             [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.arduino-library-validation.result }}" != "success" ]]; then
            echo "❌ **Some builds or tests failed**" >> $GITHUB_STEP_SUMMARY
            echo "::error::One or more CI jobs failed. Check the individual job logs for details."
            exit 1
          fi
          
          echo "✅ **All builds and tests passed!**" >> $GITHUB_STEP_SUMMARY