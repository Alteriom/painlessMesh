name: Automated Release

on:
  push:
    branches: [ main ]
    paths:
      - 'library.properties'
      - 'library.json'
      - 'CHANGELOG.md'
      - 'package.json'

# Prevent concurrent releases
concurrency:
  group: "release"
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  tag-and-release:
    name: Tag & Release if version changed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_decision.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture commit message
        id: commit
        run: |
          MSG="$(git log -1 --pretty=%B | head -n1)"
          echo "message=${MSG}" >> $GITHUB_OUTPUT
          
          # Check if this commit modifies version files (indicates version bump)
          # For merge commits, check the full diff range; for regular commits, check just that commit
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            # This is a merge commit - check all changes brought in by the merge
            CHANGED_FILES=$(git diff --name-only HEAD^1..HEAD)
          else
            # This is a regular commit - check just this commit
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          
          if echo "$CHANGED_FILES" | grep -qE '(library\.properties|library\.json|package\.json)'; then
            echo "is_version_bump=true" >> $GITHUB_OUTPUT
          else
            echo "is_version_bump=false" >> $GITHUB_OUTPUT
          fi

      - name: Read current version from library.properties
        id: version
        run: |
          VERSION=$(grep '^version=' library.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check existing tag
        id: tagcheck
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist"
          fi

      - name: Validate version consistency
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          PROP_VERSION=$(grep '^version=' library.properties | cut -d'=' -f2)
          JSON_VERSION=$(jq -r '.version' library.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          
          if [ "$PROP_VERSION" != "$JSON_VERSION" ] || [ "$PROP_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch detected:"
            echo "  library.properties: $PROP_VERSION"
            echo "  library.json: $JSON_VERSION" 
            echo "  package.json: $PKG_VERSION"
            exit 1
          fi
          
          echo "✅ Version consistency check passed: $PROP_VERSION"

      - name: Run full test suite
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          # Install dependencies
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libboost-system-dev
          
          # Initialize submodules
          git submodule update --init --recursive
          
          # Build and test
          cmake -G Ninja . -DCMAKE_CXX_FLAGS="-Wall -Werror"
          ninja
          run-parts --regex catch_ bin/

      - name: Generate changelog excerpt
        if: steps.tagcheck.outputs.exists == 'false'
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            # Extract changes for current version
            VERSION="${{ steps.version.outputs.version }}"
            awk "/^## \\[${VERSION}\\]|^## v${VERSION}/ {flag=1; next} /^## / {flag=0} flag" CHANGELOG.md > release_notes.txt
            
            if [ -s release_notes.txt ]; then
              echo "Found changelog entry for version $VERSION"
              echo "has_changelog=true" >> $GITHUB_OUTPUT
            else
              echo "No changelog entry found for version $VERSION, creating generic notes"
              echo "has_changelog=false" >> $GITHUB_OUTPUT
              echo "Release v$VERSION" > release_notes.txt
              echo "" >> release_notes.txt
              echo "This release includes the latest changes and improvements." >> release_notes.txt
            fi
          else
            echo "No CHANGELOG.md found, creating generic release notes"
            echo "has_changelog=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }}" > release_notes.txt
          fi

      - name: Create and push tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "painlessMesh v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == 'false' && (startsWith(steps.commit.outputs.message, 'release:') || steps.commit.outputs.is_version_bump == 'true')
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "painlessMesh v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.txt \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare library package
        if: steps.tagcheck.outputs.exists == 'false' && (startsWith(steps.commit.outputs.message, 'release:') || steps.commit.outputs.is_version_bump == 'true')
        run: |
          # Create a clean package for Arduino Library Manager
          mkdir -p package/painlessMesh
          
          # Copy essential files
          cp -r src examples library.properties README.md LICENSE package/painlessMesh/
          
          # Create archive
          cd package
          zip -r ../painlessMesh-v${{ steps.version.outputs.version }}.zip painlessMesh/
          cd ..

      - name: Upload library package
        if: steps.tagcheck.outputs.exists == 'false' && (startsWith(steps.commit.outputs.message, 'release:') || steps.commit.outputs.is_version_bump == 'true')
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            "./painlessMesh-v${{ steps.version.outputs.version }}.zip" \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release decision
        id: release_decision
        run: |
          if [ "${{ steps.tagcheck.outputs.exists }}" == "false" ] && ([ "${{ startsWith(steps.commit.outputs.message, 'release:') }}" == "true" ] || [ "${{ steps.commit.outputs.is_version_bump }}" == "true" ]); then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip notice (no release conditions)
        if: steps.tagcheck.outputs.exists == 'false' && !startsWith(steps.commit.outputs.message, 'release:') && steps.commit.outputs.is_version_bump != 'true'
        run: |
          echo "📋 Version changed but commit message not prefixed with 'release:' and no version files modified -> skipping auto-release."
          echo "To trigger a release, either:"
          echo "  1. Commit with message starting with 'release:', or"
          echo "  2. Commit changes to version files (library.properties, library.json, package.json)"

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag existed: ${{ steps.tagcheck.outputs.exists }}" >> $GITHUB_STEP_SUMMARY  
          echo "- Commit message: ${{ steps.commit.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version bump detected: ${{ steps.commit.outputs.is_version_bump }}" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-release: ${{ (startsWith(steps.commit.outputs.message, 'release:') || steps.commit.outputs.is_version_bump == 'true') && steps.tagcheck.outputs.exists == 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Changelog found: ${{ steps.changelog.outputs.has_changelog }}" >> $GITHUB_STEP_SUMMARY

  # Trigger the PlatformIO Library Publishing workflow.
  #
  # platformio-publish.yml listens for `release: published`, but that event never
  # fires for the release created above: GitHub suppresses events raised by the
  # built-in GITHUB_TOKEN. workflow_dispatch and repository_dispatch are the two
  # documented exceptions, so we dispatch explicitly instead. Kept as its own job
  # so a dispatch failure surfaces as a red job without blocking npm-publish.
  platformio-dispatch:
    name: Trigger PlatformIO publish
    needs: [tag-and-release]
    runs-on: ubuntu-latest
    if: needs.tag-and-release.outputs.should_release == 'true'

    permissions:
      contents: read
      actions: write

    steps:
      - name: Dispatch PlatformIO Library Publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.tag-and-release.outputs.version }}
          WORKFLOW: platformio-publish.yml
        run: |
          # Newest existing run id, so we can prove a new one appeared.
          BEFORE=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0')
          echo "Newest existing $WORKFLOW run before dispatch: $BEFORE"

          echo "🚀 Dispatching $WORKFLOW for v${VERSION} (ref: v${VERSION})..."
          gh workflow run "$WORKFLOW" \
            --repo "$REPO" \
            --ref "v${VERSION}" \
            -f version="${VERSION}"

          # A dispatch that is accepted but creates no run is the exact failure
          # mode this job exists to eliminate — verify rather than assume.
          echo "⏳ Waiting for the dispatched run to appear..."
          for _ in $(seq 1 12); do
            sleep 5
            AFTER=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "✅ PlatformIO publish run started: https://github.com/$REPO/actions/runs/$AFTER"
              echo "- PlatformIO publish: [run $AFTER](https://github.com/$REPO/actions/runs/$AFTER)" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
          done

          echo "❌ Dispatched $WORKFLOW but no new run appeared within 60s."
          echo "Publish to the PlatformIO registry manually:"
          echo "  gh workflow run $WORKFLOW --repo $REPO --ref v${VERSION} -f version=${VERSION}"
          echo "Note: npm and GitHub Release publication are unaffected by this failure."
          exit 1

  # Publish to NPM (public registry)
  npm-publish:
    needs: [tag-and-release]
    runs-on: ubuntu-latest
    if: needs.tag-and-release.outputs.should_release == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js for NPM
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm install --ignore-scripts
    
    - name: Verify NPM authentication
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "❌ NPM_TOKEN is empty!"
          echo "This repo inherits NPM_TOKEN from the Alteriom *organisation*"
          echo "secrets — it has no repository-level copy, and should not get one"
          echo "(a repo secret shadows the org secret and rotting separately is"
          echo "exactly how this breaks). Check that the org secret exists and"
          echo "that painlessMesh is in its repository-access list:"
          echo "  https://github.com/organizations/Alteriom/settings/secrets/actions"
          exit 1
        fi
        echo "🔎 Validating NPM_TOKEN against registry (npm whoami)..."
        if ! WHOAMI_OUT=$(npm whoami --registry=https://registry.npmjs.org 2>&1); then
          echo "❌ NPM_TOKEN is set but invalid (npm whoami failed):"
          echo "$WHOAMI_OUT"
          echo ""
          echo "The token has likely expired or been revoked. To fix:"
          echo "1. Mint a new granular token at https://www.npmjs.com/settings/tokens"
          echo "   - Packages and scopes: Read and write on @alteriom/painlessmesh"
          echo "   - Enable 'Bypass 2FA' — without it the publish fails with EOTP"
          echo "2. Update the NPM_TOKEN *organisation* secret (not a repo secret):"
          echo "   https://github.com/organizations/Alteriom/settings/secrets/actions"
          echo "3. Re-run this workflow"
          exit 1
        fi
        echo "✅ Authenticated to NPM as: $WHOAMI_OUT"
        echo "ℹ️  Note: whoami only proves the token is valid, not that it may"
        echo "   publish without a 2FA challenge — that surfaces at publish time."
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Validate NPM package.json
      run: |
        echo "📦 Validating NPM package configuration..."
        npm run validate-library || echo "Library validation completed"
        
        # Check if package name is available (for first-time publishing)
        echo "🔍 Checking NPM package availability..."
        if npm view @alteriom/painlessmesh version 2>/dev/null; then
          echo "✅ Package exists - this will be an update"
        else
          echo "🆕 Package doesn't exist - this will be first publication"
        fi
    
    - name: Publish to NPM
      run: ./scripts/npm-publish.sh
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: NPM Publication Success
      run: |
        VERSION=$(grep '^version=' library.properties | cut -d'=' -f2)
        echo "================================"
        echo "🎉 NPM Publication Successful!"
        echo "================================"
        echo ""
        echo "📦 Package: @alteriom/painlessmesh@$VERSION"
        echo "🔗 NPM URL: https://www.npmjs.com/package/@alteriom/painlessmesh"
        echo "📥 Install: npm install @alteriom/painlessmesh"
        echo ""
        echo "📚 Documentation:"
        echo "   - Arduino examples: examples/"
        echo "   - PlatformIO: library.json"
        echo "   - GitHub Wiki: https://github.com/Alteriom/painlessMesh/wiki"
        echo "================================"

  # Publish to GitHub Packages
  github-packages-publish:
    needs: [tag-and-release]
    runs-on: ubuntu-latest
    if: needs.tag-and-release.outputs.should_release == 'true'
    continue-on-error: true  # Don't fail the release if GitHub Packages fails
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js for GitHub Packages
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@alteriom'
    
    - name: Install dependencies
      run: npm install --ignore-scripts
    
    - name: Configure package.json for GitHub Packages
      run: |
        # Temporarily add publishConfig for GitHub Packages
        jq '.publishConfig = {"@alteriom:registry": "https://npm.pkg.github.com"}' package.json > package.json.tmp
        mv package.json.tmp package.json
    
    - name: Validate GitHub Package configuration
      run: |
        echo "📦 Validating GitHub Package configuration..."
        echo "Package name: $(grep '"name"' package.json | cut -d'"' -f4)"
        echo "Registry: https://npm.pkg.github.com"
        echo "Scope: @alteriom"
        
        # Check if package exists
        echo "🔍 Checking GitHub Package availability..."
        if npm view @alteriom/painlessmesh version 2>/dev/null; then
          echo "✅ Package exists - this will be an update"
        else
          echo "🆕 Package doesn't exist - this will be first publication"
        fi
    
    - name: Publish to GitHub Packages
      run: |
        echo "📦 Publishing to GitHub Packages..."
        if npm publish; then
          echo "✅ Successfully published to GitHub Packages"
        else
          echo "⚠️  GitHub Packages publishing failed. This might be due to:"
          echo "   1. Organization package permissions not enabled"
          echo "   2. Package name already exists"
          echo "   3. Authentication issues"
          echo ""
          echo "📦 NPM package is still available: npm install @alteriom/painlessmesh"
          exit 1
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: GitHub Packages Publication Success
      run: |
        VERSION=$(grep '^version=' library.properties | cut -d'=' -f2)
        echo "================================"
        echo "🎉 GitHub Packages Publication Successful!"
        echo "================================"
        echo ""
        echo "📦 Package: @alteriom/painlessmesh@$VERSION"
        echo "🔗 GitHub URL: https://github.com/Alteriom/painlessMesh/packages"
        echo "📥 Install: npm install @alteriom/painlessmesh"
        echo ""
        echo "🔧 Installation requires .npmrc configuration:"
        echo "   echo '@alteriom:registry=https://npm.pkg.github.com' >> .npmrc"
        echo ""
        echo "💡 Note: GitHub Packages require authentication for installation"
        echo "================================"
