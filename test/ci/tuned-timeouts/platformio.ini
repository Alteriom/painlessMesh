; Builds painlessMesh with a raised NODE_TIMEOUT, on real toolchains.
;
; CHANGELOG.md tells operators that an endpoint needing longer than the derived
; gateway budget is handled by raising GATEWAY_HTTP_TIMEOUT_MS and NODE_TIMEOUT
; together. That remedy needs configuration.hpp to leave a build-line
; -DNODE_TIMEOUT alone; before this release it did not, so the remedy could not
; be followed.
;
; test/catch/catch_node_timeout_override.cpp checks the same thing per commit on
; three compilers, but it cannot pin the production guard: test/catch/Arduino.h
; defines _PAINLESS_MESH_CONFIGURATION_HPP_ and supplies its own NODE_TIMEOUT,
; so the real header is never parsed there. This project has no shim -- same
; reason test/ci/no-ota/ exists for the OTA opt-out.

[platformio]
src_dir = .

[env]
; 20s watchdog, so the derived budget (NODE_TIMEOUT/2 + NODE_TIMEOUT/5 = 14s)
; still fits inside it -- the invariant gateway.hpp static_asserts and the one
; the documented "raise both together" remedy has to preserve.
;
; Must stay build_flags, NOT build_src_flags: NODE_TIMEOUT sizes types and
; timings across the library's own translation units too, so a sketch-only
; definition would leave src/wifi.cpp and src/painlessMeshSTA.cpp on the 10s
; default while the sketch believed it had raised it.
build_flags = -DNODE_TIMEOUT="(20*TASK_SECOND)"
lib_extra_dirs = ../../../
lib_ldf_mode = deep+
lib_deps =
    bblanchon/ArduinoJson
    arkhipenko/TaskScheduler

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncTCP@^2.0.0
