; Builds painlessMesh with the OTA plugin compiled out, on real toolchains.
;
; SECURITY.md documents -DPAINLESSMESH_DISABLE_OTA as the only mitigation for
; unauthenticated mesh OTA, so it needs a build that proves it works. The
; desktop catch test (test/catch/catch_ota_disabled.cpp) cannot do that on its
; own: test/catch/Arduino.h shadows painlessmesh/configuration.hpp wholesale
; via its include guard, so the production guard is never parsed there and a
; regression in it would leave that test green.
;
; This project has no shim. It parses the real header, and applies the flag as
; a build flag so every translation unit in the library sees it -- which is
; also the only correct way to set it, a sketch-local #define being an ODR
; violation.

[platformio]
src_dir = .

[env]
; Must stay build_flags, NOT build_src_flags. build_flags reaches the library
; sources too (src/wifi.cpp, src/painlessMeshSTA.cpp both pull in mesh.hpp);
; build_src_flags would apply only to this project's sources, leaving those
; translation units with an OTA-enabled painlessmesh::Mesh while the sketch
; sees an OTA-free one. That links cleanly and is an ODR violation -- exactly
; the failure this fixture exists to keep out of operators' builds.
build_flags = -DPAINLESSMESH_DISABLE_OTA
lib_extra_dirs = ../../../
lib_ldf_mode = deep+
lib_deps =
    bblanchon/ArduinoJson
    arkhipenko/TaskScheduler

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncTCP@^2.0.0
