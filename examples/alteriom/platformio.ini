[platformio]
src_dir = .

[env]
lib_deps =
    bblanchon/ArduinoJson
    arkhipenko/TaskScheduler

lib_ldf_mode = deep+
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ../../  ; Load the local copy of painlessmesh. For your own example add painlessmesh to the lib_deps
lib_deps =
    ${env.lib_deps}  ; Inherit common dependencies
    esp32async/ESPAsyncTCP@^2.0.0  ; Only for ESP8266

[env:esp32]
; Pinned to the ESP32 Arduino 2.x core, which compiles as gnu++11: a struct
; with default member initializers is not an aggregate there, and this is the
; one CI build that proves the library still builds on it (#466 review).
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
lib_extra_dirs = ../../  ; Load the local copy of painlessmesh. For your own example add painlessmesh to the lib_deps
lib_deps =
    ${env.lib_deps}  ; Inherit common dependencies
    esp32async/AsyncTCP